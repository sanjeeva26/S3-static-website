<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beautiful Website</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  color: #fff;
  background: #0f2027;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  position: fixed;
  width: 100%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  z-index: 1000;
}

nav a {
  color: #fff;
  margin: 0 15px;
  text-decoration: none;
}

/* HERO WITH IMAGE */
.hero {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero-overlay {
  background: rgba(0,0,0,0.6);
  padding: 40px;
  border-radius: 15px;
}

.hero h1 {
  font-size: 3.5rem;
}

.hero button {
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
}

/* SECTION */
section {
  padding: 80px 20px;
  text-align: center;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* IMAGE CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.card {
  border-radius: 15px;
  overflow: hidden;
  background: #fff;
  color: #000;
  transition: 0.3s;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card:hover {
  transform: scale(1.05);
}

.card h3 {
  padding: 10px;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  border-radius: 10px;
}

/* CONTACT */
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
}

/* FOOTER */
footer {
  padding: 20px;
  text-align: center;
  background: #000;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <h2>MyBrand</h2>
  <div>
    <a href="#services">Services</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-overlay">
    <h1>🌍 Explore Beautiful Designs</h1>
    <p>Modern websites hosted on AWS S3</p>
  </div>
</section>

<!-- SERVICES WITH IMAGES -->
<section id="services">
  <div class="container">
    <h2>✨ Our Services</h2>
    <div class="cards">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
        <h3>Web Development</h3>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f">
        <h3>Cloud Hosting</h3>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
        <h3>Team Collaboration</h3>
      </div>
    </div>
  </div>
</section>

<!-- IMAGE GALLERY -->
<section id="gallery">
  <div class="container">
    <h2>📸 Gallery</h2>
    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
      <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7">
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e">
    </div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="container">
    <h2>📩 Contact</h2>
    <form onsubmit="submitForm(event)">
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <textarea rows="5" placeholder="Message"></textarea>
      <button>Send</button>
    </form>
    <p id="msg"></p>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 MyBrand | AWS S3 Website</p>
</footer>

<script>
function submitForm(e) {
  e.preventDefault();
  document.getElementById("msg").innerText = "✅ Message sent!";
}
</script>

</body>
</html>
